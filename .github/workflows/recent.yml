name: Recently pushed

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List the latest public repositories I pushed to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "users/${{ github.repository_owner }}/repos?sort=pushed&per_page=30" \
            --jq '[.[] | select(.fork | not) | select(.name != "${{ github.event.repository.name }}") | select(.description != null)][:4]
                  | .[] | "- [\(.name)](\(.html_url)) \(.description | gsub("[\\n\\r]"; " ") | .[0:110]) <sub>\(.pushed_at[0:10])</sub>"' > recent.md
          python3 - <<'EOF'
          import re
          readme = open("README.md", encoding="utf-8").read()
          block = open("recent.md", encoding="utf-8").read().strip()
          new = re.sub(r"(<!-- recent:start -->).*?(<!-- recent:end -->)", lambda m: f"{m.group(1)}\n{block}\n{m.group(2)}", readme, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(new)
          EOF
          rm recent.md
      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "Update recently pushed repositories" && git push)

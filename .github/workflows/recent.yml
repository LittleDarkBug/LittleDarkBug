name: Recently pushed

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List the latest public repositories I pushed to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "users/${{ github.repository_owner }}/repos?sort=pushed&per_page=50" > repos.json
          python3 - <<'EOF'
          import json, re
          owner = "${{ github.repository_owner }}"
          readme = open("README.md", encoding="utf-8").read()
          before = readme.split("<!-- recent:start -->")[0]
          # les dépôts déjà présentés plus haut ne sont pas répétés
          shown = set(re.findall(rf"github\.com/{owner}/([\w.-]+)", before, flags=re.I))
          shown.add("${{ github.event.repository.name }}")

          def cut(text, n=100):
              text = " ".join(text.split())
              if len(text) <= n:
                  return text
              return text[:n].rsplit(" ", 1)[0].rstrip(",.;:") + "…"

          lines = []
          for r in json.load(open("repos.json", encoding="utf-8")):
              if r["fork"] or not r["description"] or r["name"] in shown:
                  continue
              lines.append(f"- [{r['name']}]({r['html_url']}) {cut(r['description'])} <sub>{r['pushed_at'][:10]}</sub>")
              if len(lines) == 4:
                  break
          block = "\n".join(lines)
          new = re.sub(r"(<!-- recent:start -->).*?(<!-- recent:end -->)", lambda m: f"{m.group(1)}\n{block}\n{m.group(2)}", readme, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(new)
          EOF
          rm repos.json
      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "Update recently pushed repositories" && git push)
